<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640" role="img" aria-labelledby="title desc">
  <title id="title">Foundation-model benchmarking pipeline</title>
  <desc id="desc">Flowchart showing official MAMA-MIA split, benchmark manifest, image input selection, preprocessing, frozen model embedding, optional clinical variables, logistic regression, pCR probability, and test evaluation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2.5; rx: 14; filter: url(#shadow); }
      .data { fill: #eef6ff; stroke: #2563eb; }
      .image { fill: #f0fdf4; stroke: #16a34a; }
      .model { fill: #f5f3ff; stroke: #7c3aed; }
      .probe { fill: #fff7ed; stroke: #ea580c; }
      .eval { fill: #fef2f2; stroke: #dc2626; }
      .text { font-family: Inter, Arial, sans-serif; font-size: 24px; font-weight: 650; fill: #0f172a; text-anchor: middle; }
      .sub { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 450; fill: #475569; text-anchor: middle; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .note { font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 650; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="640"/>

  <rect class="box data" x="45" y="95" width="225" height="110"/>
  <text class="text" x="157.5" y="137">Official</text>
  <text class="text" x="157.5" y="167">MAMA-MIA</text>
  <text class="sub" x="157.5" y="193">train/test split</text>

  <rect class="box data" x="325" y="95" width="225" height="110"/>
  <text class="text" x="437.5" y="137">Benchmark</text>
  <text class="text" x="437.5" y="167">manifest</text>
  <text class="sub" x="437.5" y="193">one row per patient</text>

  <rect class="box image" x="605" y="95" width="235" height="110"/>
  <text class="text" x="722.5" y="135">Select image</text>
  <text class="text" x="722.5" y="165">input</text>
  <text class="sub" x="722.5" y="191">phase / ROI / fusion</text>

  <rect class="box image" x="895" y="95" width="235" height="110"/>
  <text class="text" x="1012.5" y="135">Model-specific</text>
  <text class="text" x="1012.5" y="165">preprocessing</text>
  <text class="sub" x="1012.5" y="191">resize / normalize</text>

  <rect class="box model" x="1185" y="95" width="250" height="110"/>
  <text class="text" x="1310" y="135">Frozen foundation</text>
  <text class="text" x="1310" y="165">model</text>
  <text class="sub" x="1310" y="191">no fine-tuning</text>

  <rect class="box model" x="895" y="345" width="235" height="110"/>
  <text class="text" x="1012.5" y="387">Patient-level</text>
  <text class="text" x="1012.5" y="417">embedding</text>

  <rect class="box data" x="325" y="345" width="225" height="110"/>
  <text class="text" x="437.5" y="387">Clinical</text>
  <text class="text" x="437.5" y="417">variables</text>

  <rect class="box data" x="605" y="345" width="235" height="110"/>
  <text class="text" x="722.5" y="385">Train-only</text>
  <text class="text" x="722.5" y="415">impute/scale</text>

  <rect class="box probe" x="1185" y="345" width="250" height="110"/>
  <text class="text" x="1310" y="385">L2 logistic</text>
  <text class="text" x="1310" y="415">regression</text>

  <rect class="box eval" x="895" y="510" width="235" height="90"/>
  <text class="text" x="1012.5" y="548">pCR</text>
  <text class="text" x="1012.5" y="578">probability</text>

  <rect class="box eval" x="1185" y="510" width="250" height="90"/>
  <text class="text" x="1310" y="548">Official test</text>
  <text class="text" x="1310" y="578">evaluation</text>

  <path class="arrow" d="M 270 150 L 325 150"/>
  <path class="arrow" d="M 550 150 L 605 150"/>
  <path class="arrow" d="M 840 150 L 895 150"/>
  <path class="arrow" d="M 1130 150 L 1185 150"/>
  <path class="arrow" d="M 1310 205 C 1310 285, 1013 285, 1013 345"/>
  <path class="arrow" d="M 550 400 L 605 400"/>
  <path class="arrow" d="M 840 400 L 895 400"/>
  <path class="arrow" d="M 1130 400 L 1185 400"/>
  <path class="arrow" d="M 1310 455 C 1310 500, 1013 485, 1013 510"/>
  <path class="arrow" d="M 1130 555 L 1185 555"/>

  <text class="note" x="980" y="292">image branch</text>
  <text class="note" x="575" y="505">clinical branch only uses training-fit preprocessing</text>
</svg>
